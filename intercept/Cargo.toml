[package]
name = "faf-dns-intercept"
version = "0.1.0"
edition = "2024"

[lib]
name = "faf_dns_intercept"
path = "src/lib.rs"

[[bin]]
name = "debug"
path = "src/bin/main.rs"

[[example]]
name = "simple_usage"
path = "examples/simple_usage.rs"

[dependencies]
ctrlc = "3.4"

[target.'cfg(target_os = "linux")'.dependencies]
libbpf-rs = "0.25"
libc = "0.2"
